# Fly.io — https://fly.io/docs/launch/
# 1. fly auth login
# 2. fly launch --no-deploy   (ou: fly apps create framework-adocao-ia-sdlc)
# 3. fly secrets set GEMINI_API_KEY=sua_chave
# 4. fly deploy

app = 'framework-adocao-ia-sdlc'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
