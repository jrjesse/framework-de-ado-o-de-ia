name: Dúvida de uso
description: Como rodar, configurar ou aplicar o framework
title: "[dúvida] "
labels: ["question"]
body:
  - type: textarea
    id: duvida
    attributes:
      label: Sua dúvida
    validations:
      required: true
  - type: textarea
    id: tentou
    attributes:
      label: O que você já tentou?
      placeholder: "ex.: npm run dev, configurei GEMINI_API_KEY..."
    validations:
      required: false
